databases:
  - name: smartfinx-db
    databaseName: smartfinx
    user: smartfinx
    plan: basic-256mb
    region: singapore

services:
  - type: web
    name: smartfinx
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    disk:
      name: smartfinx-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartfinx-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: smartfinx.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://smartfinx.onrender.com
      - key: DJANGO_MEDIA_ROOT
        value: /var/data/media
      - key: PYTHON_VERSION
        value: 3.13.4
